<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- GDGoC IET DAVV wordmark, centre-cropped to a square so it is not
         letterboxed inside the tab. PNG rather than SVG because the source is
         a raster export; 512px covers high-DPI tabs, and browsers downscale
         from it. The old /favicon.svg was still the stock Vite logo. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EEF2F7" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="GDG Fresher's Recruitment registration — GDGoC IET DAVV, Indore. Session 2026-27."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>GDG Fresher's Recruitment — Registration | GDGoC IET DAVV</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applies the stored theme before first paint. Without this, a returning
      // student who chose dark gets a white flash on every page load, because
      // React has not mounted yet and cannot have set the class.
      //
      // Defaults to LIGHT and never consults prefers-color-scheme. This must agree
      // with readStoredPreference() in src/theme/ThemeProvider.tsx - if the two
      // disagree, the page paints one theme and then React switches to the other,
      // which is the flash this whole block exists to prevent.
      ;(function () {
        try {
          var stored = localStorage.getItem('gdgoc.theme')
          var dark = stored === 'dark'
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* storage blocked - fall back to light */
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
